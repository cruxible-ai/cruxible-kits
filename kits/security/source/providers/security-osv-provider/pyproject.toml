# The security kit's dependency plane (D-R37 template form). One distribution,
# one lock, one identity unit; three operations:
#   sbom.components (derive, pure): one SBOM Capture -> one derived JSON
#                   document (the inventory key and its components, K-B1-G1);
#   osv.query       (fetch, external_read): OSV's raw responses, one Capture each;
#   osv.match       (derive, pure): those responses + the queried components ->
#                   one derived JSON document (affected pairs with fixed
#                   versions, `queried`, `not_checked`).
[project]
name = "security-osv-provider"
version = "0.1.0.dev0"
description = "Security kit provider: OSV.dev queries (raw responses) and their match derivation."
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "The Cruxible maintainers" }]
dependencies = [
  "cruxible-provider-runtime>=0.4.0",
  "httpx>=0.27",
]

[project.entry-points."cruxible.providers"]
"osv.query" = "security_osv_provider.osv:OsvQuery"
"osv.match" = "security_osv_provider.osv:OsvMatch"
"sbom.components" = "security_osv_provider.sbom:SbomComponents"

[dependency-groups]
dev = ["pytest>=8.2"]

[build-system]
requires = ["hatchling==1.32.1"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/security_osv_provider"]

[tool.hatch.build.targets.wheel.extra-metadata]
"uv.lock" = "uv.lock"

[tool.uv.sources]
cruxible-provider-runtime = { path = "../cruxible-provider-runtime", editable = true }
