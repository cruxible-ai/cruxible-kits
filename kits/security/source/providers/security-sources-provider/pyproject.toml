# The security kit's network Sources: OSV.dev (component advisories by package
# URL, advisory records), FIRST's EPSS daily scores file, one GitHub
# repository's declared files at a ref, what PyPI serves for a project
# (files, digests, provenance) and a release asset's served bytes. No credentials. Each returns the
# exact exchanges as Core's acquisition wire; the kit's CaptureContracts grade
# them. It is not published: it ships inside the security kit as its built
# wheel plus this lock, and `cruxible kit add` installs it before the kit's
# definitions. Release gates bind a fixture implementation instead.
[project]
name = "security-sources-provider"
version = "1.2.0"
description = "Security kit provider: OSV.dev, FIRST EPSS, GitHub and PyPI acquisition Sources."
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "cruxible-provider-runtime>=0.2.0",
  "httpx>=0.27",
]

[project.entry-points."cruxible.providers"]
"security.osv-query" = "security_sources_provider.sources:OsvQuery"
"security.epss-daily" = "security_sources_provider.sources:EpssDaily"
"security.repo-snapshot" = "security_sources_provider.sources:RepoSnapshot"
"security.pypi-release" = "security_sources_provider.sources:PypiRelease"
"security.release-asset" = "security_sources_provider.sources:ReleaseAsset"

[dependency-groups]
dev = ["pytest>=8.2"]

[build-system]
requires = ["hatchling==1.32.1"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/security_sources_provider"]

# The lock travels inside the wheel, as the provider template does.
[tool.hatch.build.targets.wheel.extra-metadata]
"uv.lock" = "uv.lock"
