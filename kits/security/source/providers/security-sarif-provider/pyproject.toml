# The security kit's code-findings derive (kit batch 2, D-R37 template form). One
# distribution, one lock, one identity unit; one operation:
#   sarif.findings (derive, pure): this run's SARIF Capture(s) + the held findings
#                  -> one derived JSON document (findings by key, coverage header,
#                  attention records for regressions and location gaps).
# The SARIF file itself is read by core's builtin workspace.file; this package
# never reads the network or the clock.
[project]
name = "security-sarif-provider"
version = "0.1.0.dev0"
description = "Security kit provider: SARIF 2.1.0 scan results to code findings, by key."
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "The Cruxible maintainers" }]
dependencies = [
  "cruxible-provider-runtime>=0.4.0",
]

[project.entry-points."cruxible.providers"]
"sarif.findings" = "security_sarif_provider.sarif:SarifFindings"

[dependency-groups]
dev = ["pytest>=8.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/security_sarif_provider"]

[tool.hatch.build.targets.wheel.extra-metadata]
"uv.lock" = "uv.lock"
