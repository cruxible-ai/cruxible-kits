# The security kit's analysis provider: deterministic readings of the KEV
# catalog, the EPSS daily file, CycloneDX SBOMs, OSV answers, CVE records,
# repository snapshots (workflows, release manifests), PyPI releases and SARIF
# scan logs, runtime inventories, log reads and credential states, plus the
# hardening and incident-respond classifiers, returned as Claim proposal items or
# inbox payloads.
# No network, no clock. It is not published: it ships inside the security kit
# as its built wheel plus this lock, and `cruxible kit add` installs it before
# the kit's definitions.
[project]
name = "security-analysis-provider"
version = "1.3.0"
description = "Security kit provider: KEV, EPSS, SBOM, applicability and system-model analysis to proposal items."
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "cruxible-provider-runtime>=0.2.0",
  "pyyaml>=6.0",
]

[project.entry-points."cruxible.providers"]
"security.kev-catalog" = "security_analysis_provider.kev:KevTriage"
"security.kev-attention" = "security_analysis_provider.kev:KevAttention"
"security.epss-scores" = "security_analysis_provider.epss:EpssTriage"
"security.cyclonedx-components" = "security_analysis_provider.sbom:CycloneDxComponents"
"security.osv-applicability" = "security_analysis_provider.applicability:OsvApplicability"
"security.cve-applicability" = "security_analysis_provider.applicability:CveApplicability"
"security.workflow-facts" = "security_analysis_provider.workflows:WorkflowFacts"
"security.registry-facts" = "security_analysis_provider.registry:RegistryFacts"
"security.sarif-findings" = "security_analysis_provider.sarif:SarifFindings"
"security.harden" = "security_analysis_provider.harden:Harden"
"security.runtime-inventory" = "security_analysis_provider.response:RuntimeInventory"
"security.log-reads" = "security_analysis_provider.response:LogReads"
"security.credential-state" = "security_analysis_provider.response:CredentialState"
"security.respond" = "security_analysis_provider.response:Respond"

[dependency-groups]
dev = ["pytest>=8.2"]

[build-system]
requires = ["hatchling==1.32.1"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/security_analysis_provider"]

# The lock travels inside the wheel, as the provider template does.
[tool.hatch.build.targets.wheel.extra-metadata]
"uv.lock" = "uv.lock"
