# Drop-in GitHub Actions workflow for the Cruxible security kit (1.4.0, Cruxible 0.6).
#
# Copy to .github/workflows/cruxible-security.yml. On each push to the default
# branch, each pull request and once a day it:
#
#   1. generates a CycloneDX SBOM of the repository (anchore/sbom-action, Syft);
#   2. creates a disposable one-owner Cruxible instance with a fresh, ephemeral CI
#      key under $RUNNER_TEMP, installs the kit and adopts its recipes: no JSON to
#      write or edit;
#   3. runs the security.start Runbook (every SBOM import Line, then OSV, CISA
#      KEV and FIRST EPSS, then the attention Lines) and fails unless the run
#      completed: a run that stopped for review or on a failed step exports nothing;
#   4. prints `cruxible next` and the urgent worklist, and exports OpenVEX with the
#      kit's read-only script export-vex, uploaded as a build artifact only when
#      that completed run produced it.
#
# Custody: every job, pull requests included, gets its own instance and key, made
# here and discarded with the runner. Nothing Cruxible signs with, and no governed
# state, is ever written to or restored from the GitHub Actions cache (a cache a
# pull request job can restore is no place for a signing key). Persistent signing
# keys and governed daemon state that keep judgments between runs belong on a
# dedicated runner or a hosted service: point CI at that shared daemon instead
# (CRUXIBLE_SERVER_URL and a bearer credential as secrets, independent approval
# kept) and drop the instance steps; see the kit README. Only the tool cache
# (setup-uv's) uses Actions cache.
#
# The runner calls api.osv.dev, www.cisa.gov and api.first.org (the Lines' declared
# origins) and PyPI (Cruxible and the kit's providers).
#
# Tailor: SBOM_PATH (and the SBOM step) for your generator; add one
# `kit adopt security:sbom --param name=N --param relative_path=P` per further SBOM
# (a container image, a second service): security.start runs every one. Add
# `kit adopt security:sarif` for a scanner's SARIF file.

name: cruxible-security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CRUXIBLE_VERSION: "0.6.0"
  SECURITY_KIT: "security:1.4.0"
  SBOM_PATH: sbom.cdx.json
  VEX_PATH: vex.openvex.json

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Tool cache only: never Cruxible keys or state.
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Cruxible
        run: uv tool install "cruxible==${CRUXIBLE_VERSION}"

      - name: Generate the SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: ${{ env.SBOM_PATH }}
          upload-artifact: false

      - name: Create a disposable instance
        run: |
          set -euo pipefail
          # The daemon's state root and the CLI's settings and ephemeral principal key
          # (outside both the state root and the workspace), discarded with the runner.
          # The daemon refuses a socket in a directory others can read: keep it 0700.
          base="$RUNNER_TEMP/cruxible"
          mkdir -m 700 "$base"
          mkdir -p "$base/state" "$base/config"
          {
            echo "CRUXIBLE_STATE_ROOT=$base/state"
            echo "CRUXIBLE_SERVER_SOCKET=$base/d.sock"
            echo "XDG_CONFIG_HOME=$base/config"
          } >> "$GITHUB_ENV"
          nohup cruxible server start --socket "$base/d.sock" --state-root "$base/state" \
            > "$RUNNER_TEMP/cruxible-daemon.log" 2>&1 &
          for _ in $(seq 60); do
            if CRUXIBLE_SERVER_SOCKET="$base/d.sock" cruxible server status --json > /dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/cruxible-daemon.log"
          exit 1

      - name: Install the kit and adopt its recipes
        run: |
          set -euo pipefail
          cruxible init --principal-id ci
          # One proposal: the kit's providers and definitions together.
          cruxible kit add "$SECURITY_KIT" --commit
          cruxible kit adopt security --yes
          cruxible kit adopt security:sbom --param name=app --param relative_path="$SBOM_PATH" --yes
          # Under self-approval each change lands at once: anything left open is a failure.
          open="$(cruxible proposal list --status open --json)"
          echo "$open"
          if [ "$(echo "$open" | jq '.entries | length')" != 0 ]; then
            echo "::error::Cruxible proposals are still open after install; the instance is incomplete"
            exit 1
          fi

      - name: Run security.start
        run: |
          set -euo pipefail
          rm -f "$VEX_PATH"
          cruxible runbook preview security.start
          # Exits 1 on a failed step; a stop for review exits 0, so read the status.
          cruxible runbook run security.start --json > "$RUNNER_TEMP/start.json" || {
            cat "$RUNNER_TEMP/start.json"
            echo "::error::security.start failed"
            exit 1
          }
          status="$(jq -r '.status' "$RUNNER_TEMP/start.json")"
          if [ "$status" != "completed" ]; then
            jq . "$RUNNER_TEMP/start.json"
            echo "::error::security.start did not complete (status: $status, stop_reason: $(jq -r '.stop_reason // "none"' "$RUNNER_TEMP/start.json"), step: $(jq -r '.stopped_at_step // "none"' "$RUNNER_TEMP/start.json")); no VEX is exported"
            exit 1
          fi

      - name: Report
        run: |
          set -euo pipefail
          cruxible next
          cruxible query --name security.urgent_exposures
          cruxible kit run security:export-vex -- --format openvex -o "$VEX_PATH"

      - name: Upload VEX
        # Only after the completed run and its fresh export (a failed step skips this).
        uses: actions/upload-artifact@v4
        with:
          name: vex
          path: ${{ env.VEX_PATH }}
          if-no-files-found: error

      - name: Stop the daemon
        if: always()
        run: |
          if [ -n "${CRUXIBLE_STATE_ROOT:-}" ]; then
            cruxible server stop --state-root "$CRUXIBLE_STATE_ROOT" --timeout 30 || true
          fi
