# The security kit gate's offline Sources: cruxible-provider-web's own WebFetch
# and the kit's own OSV, EPSS, GitHub repository and PyPI adapters, with the
# socket replaced by a transport serving the vendored KEV catalog, CVE records,
# OSV answers, EPSS file and recorded GitHub and PyPI answers from this package.
# Gate fixture only, never published.
[project]
name = "security-gate-sources"
version = "0.3.0"
description = "Offline web.fetch and the security kit's Sources for the security kit gate."
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "cruxible-provider-runtime>=0.2.0",
  "cruxible-provider-web==0.2.2",
  "httpx>=0.27",
]

[project.entry-points."cruxible.providers"]
"web.fetch" = "security_gate_sources.web:GateWebFetch"
"security.osv-query" = "security_gate_sources.feeds:GateOsvQuery"
"security.epss-daily" = "security_gate_sources.feeds:GateEpssDaily"
"security.repo-snapshot" = "security_gate_sources.feeds:GateRepoSnapshot"
"security.pypi-release" = "security_gate_sources.feeds:GatePypiRelease"
"security.release-asset" = "security_gate_sources.feeds:GateReleaseAsset"

[build-system]
requires = ["hatchling==1.32.1"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/security_gate_sources"]

[tool.hatch.build.targets.wheel.extra-metadata]
"uv.lock" = "uv.lock"
