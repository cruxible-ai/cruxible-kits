# Package-side provider manifest for the iot-fleet telemetry derive (schema 2).
# A transcription SOURCE, never authority: the accepted Provider build is.
schema_version: 2
provider_id: iot-telemetry-provider
distribution:
  name: iot-telemetry-provider
  version: 0.1.0
entrypoint_group: cruxible.providers
supported_protocol_majors: [2]
implementations:
  # Serves telemetry.analyze: pure @derive function. Reads one hub telemetry batch Capture
  # and approved fleet.baseline rows; applies EWMA smoothing, flatline detection, and
  # bound comparison; emits one derived JSON document.
  - entrypoint: "iot_telemetry_provider.telemetry:telemetry_analyze"
    backends: [local_env, container]
    requires_extras: []
    declared_endpoints: []
    deterministic: true
