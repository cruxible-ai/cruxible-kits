name: kits

on:
  pull_request:
  push:
    branches: [main]
  # Publishing runs only when started by hand until the kits namespace is
  # ready to go public.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  kits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install the kit tooling
        # cruxible-client ships the artifact library; pinned to a core commit
        # until a release carries it.
        run: >-
          uv venv &&
          uv pip install
          "cruxible-client @ git+https://github.com/cruxible-ai/cruxible@07b11ba84556bd090a3bdf9c448fc71797fad3c4#subdirectory=packages/cruxible-client"
      - name: Check every kit
        run: uv run --no-project python scripts/kits.py check
      - name: Publish new kit versions
        if: github.event_name == 'workflow_dispatch'
        env:
          CRUXIBLE_REGISTRY: ghcr.io
          CRUXIBLE_REGISTRY_USERNAME: ${{ github.actor }}
          CRUXIBLE_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: uv run --no-project python scripts/kits.py publish
