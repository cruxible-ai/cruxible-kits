name: kits

on:
  pull_request:
  push:
    branches: [main]
  # Publishing runs only when started by hand until the kits namespace is
  # ready to go public.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  kits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install the kit tooling
        # cruxible-client ships the artifact library; the core (cruxible) runs the
        # format and acceptance checks `kit add` runs. Both pinned to the core
        # release these kits are built for (0.6.0, from PyPI; the security kit's
        # 1.4.0 template needs 0.6).
        run: >-
          uv venv &&
          uv pip install
          "cruxible-client==0.6.0"
          "cruxible==0.6.0"
      - name: Check every kit
        run: uv run --no-project python scripts/kits.py check
      - name: Publish new kit versions
        if: github.event_name == 'workflow_dispatch'
        env:
          CRUXIBLE_REGISTRY: ghcr.io
          CRUXIBLE_REGISTRY_USERNAME: ${{ github.actor }}
          CRUXIBLE_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: uv run --no-project python scripts/kits.py publish
