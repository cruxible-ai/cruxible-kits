name: kits

on:
  pull_request:
  push:
    branches: [main]
  # Publishing runs only when started by hand until the kits namespace is
  # ready to go public.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  kits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install the kit tooling
        # cruxible-client ships the artifact library; the core (cruxible) runs the
        # format and acceptance checks `kit add` runs. Both pinned to one core
        # commit until a release carries them.
        run: >-
          uv venv &&
          uv pip install
          "cruxible-client @ git+https://github.com/cruxible-ai/cruxible@393057b847a4e627875b5171da81b0bc69e50c5c#subdirectory=packages/cruxible-client"
          "cruxible @ git+https://github.com/cruxible-ai/cruxible@393057b847a4e627875b5171da81b0bc69e50c5c"
      - name: Check every kit
        run: uv run --no-project python scripts/kits.py check
      - name: Publish new kit versions
        if: github.event_name == 'workflow_dispatch'
        env:
          CRUXIBLE_REGISTRY: ghcr.io
          CRUXIBLE_REGISTRY_USERNAME: ${{ github.actor }}
          CRUXIBLE_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: uv run --no-project python scripts/kits.py publish
